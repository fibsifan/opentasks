[versions]
jems-version = "1.43"
contentpal-version = "0.6"
androidx-test-runner-version = "1.1.1"

[libraries]
# Support & Google libraries
support-appcompat = { module = "androidx.appcompat:appcompat", version = "1.2.0" }
support-annotations = { module = "androidx.annotation:annotation", version = "1.1.0" }
support-design = { module = "com.google.android.material:material", version = "1.2.1" }
android-dashclock = { module = "com.google.android.apps.dashclock:dashclock-api", version = "2.0.0" }
# dmfs
jems = { module = "org.dmfs:jems", version.ref = "jems-version" }
datetime = { module = "org.dmfs:rfc5545-datetime", version = "0.2.4" }
lib-recur = { module = "org.dmfs:lib-recur", version = "0.12.2" }
xml-magic = { module = "org.dmfs:android-xml-magic", version = "0.1.1" }
color-picker = { module = "com.github.dmfs:color-picker", version = "1.3" }
android-carrot = { module = "com.github.dmfs.androidcarrot:androidcarrot", version = "13edc04" }
bolts-color = { module = "com.github.dmfs.Bolts:color-bolts", version = "0.1" }
contentpal = { module = "com.github.dmfs.contentpal:contentpal", version.ref = "contentpal-version" }
retention-magic = { module = "com.github.dmfs:retention-magic", version = "1.3" }

# 3rd party
codeka-carrot = { module = "au.com.codeka:carrot", version = "2.4.0" }

# Testing
junit = { module = "junit:junit", version = "4.13.2" }
hamcrest = { module = "org.hamcrest:hamcrest-library", version = "1.3" }
mockito = { module = "org.mockito:mockito-core", version = "2.27.0" }
robolectric = { module = "org.robolectric:robolectric", version = "3.5.1" }
support-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner-version" }
support-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-runner-version" }

# dmfs testing
jems_testing = { module = "org.dmfs:jems-testing", version.ref = "jems-version" }
contenttestpal = { module = "com.github.dmfs.contentpal:contenttestpal", version.ref = "contentpal-version" }
contentpal_testing = { module = "com.github.dmfs.contentpal:contentpal-testing", version.ref = "contentpal-version" }

[plugins]
play-publisher = { id = "com.github.triplet.play", version = "2.8.1" }